name: Refresh tournament data

# Twice a day + on-demand. The committed SQLite DB carries the per-tournament
# detail cache between runs, so each run is a handful of requests, not a cold
# ~1500-request crawl — keeping us clear of chess-results' 2000 req/IP/day cap.
on:
  schedule:
    - cron: "0 1,13 * * *"   # 01:00 and 13:00 UTC
  workflow_dispatch: {}        # manual "Run workflow" button in the Actions tab

# Let the job commit the refreshed data + DB back to the repo.
permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false    # never run two crawls at once (doubles the request budget)

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh sources and export JSON
        run: python scripts/export_json.py

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/tournaments.json backend/data/chess.sqlite
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            # No [skip ci]: this push to site/** is exactly what triggers the
            # Pages deploy to publish the new data. refresh.yml itself only runs
            # on schedule/workflow_dispatch, so there's no risk of a commit loop.
            git commit -m "chore: refresh tournament data"
            git push
          fi
