name: Refresh tournament data

# Twice a day + on-demand. The committed SQLite DB carries the per-tournament
# detail cache between runs, so each run is a handful of requests, not a cold
# ~1500-request crawl — keeping us clear of chess-results' 2000 req/IP/day cap.
on:
  schedule:
    - cron: "0 1,13 * * *"   # 01:00 and 13:00 UTC
  workflow_dispatch: {}        # manual "Run workflow" button in the Actions tab

# Union of what the two jobs need: `refresh` commits data back to the repo,
# `publish` deploys Pages. Each job narrows this to its own subset below — a
# reusable-workflow call can downgrade the caller's token but never escalate it,
# so `pages`/`id-token` have to be granted here too.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false    # never run two crawls at once (doubles the request budget)

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh sources and export JSON
        run: python scripts/export_json.py

      - name: Commit refreshed data
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/tournaments.json backend/data/chess.sqlite
          if git diff --cached --quiet; then
            echo "No data changes."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: refresh tournament data"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  # A push made with the default GITHUB_TOKEN never fires another workflow's
  # `push` trigger (GitHub's recursion guard), so pages.yml can't pick the data
  # commit up on its own — no matter what the commit message says. Call it
  # directly instead, pinned to the commit we just pushed.
  publish:
    needs: refresh
    if: needs.refresh.outputs.committed == 'true'
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.refresh.outputs.sha }}
    permissions:
      contents: read
      pages: write
      id-token: write
