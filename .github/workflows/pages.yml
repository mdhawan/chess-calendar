name: Deploy site to GitHub Pages

# Publishes site/ (the static frontend + committed tournaments.json) whenever it
# changes on main — including the data commits pushed by refresh.yml.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}
  # refresh.yml calls this after committing new data — its own push can't fire
  # the `push` trigger above (see the note in refresh.yml).
  workflow_call:
    inputs:
      ref:
        description: "Ref to publish. Empty = the ref that triggered this run."
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

# Only the newest deploy matters; cancel a superseded one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # On a workflow_call from refresh.yml, github.sha is the caller's trigger
      # commit — i.e. *before* the data commit. Publish the ref it hands us.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/configure-pages@v5
      # deploy-pages resolves the artifact by *name* over the whole workflow
      # run, not per attempt — so a re-run's upload sits alongside the first
      # attempt's and the lookup dies on "Multiple artifacts named github-pages
      # ... Artifact count is 2". Scoping the name to the attempt keeps a
      # re-run's lookup unambiguous. (Pages deploys by artifact id, so the name
      # itself doesn't have to be "github-pages".)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          # Pages' backend sometimes needs longer than the action's 10-minute
          # default to report a deployment complete, and on timeout the action
          # cancels a deploy that was seconds from landing. 20 minutes.
          timeout: 1200000
